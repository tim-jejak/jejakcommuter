name: Perbarui data tempat terdekat

on:
  schedule:
    - cron: "17 20 1 * *"   # tiap tanggal 1 pukul 03.17 WIB
  workflow_dispatch: {}      # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unduh data dari OpenStreetMap
        run: python3 scripts/bake_poi.py
      - name: Simpan bila ada perubahan
        run: |
          git config user.name "jejakcommuter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add poi.js
          git diff --cached --quiet && echo "Tidak ada perubahan" || (git commit -m "Perbarui data tempat terdekat" && git push)
