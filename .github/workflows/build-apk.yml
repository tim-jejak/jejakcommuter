name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        run: npm install

      - name: Isi nomor versi
        run: sed -i "s/__APPBUILD__/${{ github.run_number }}/" www/index.html

      - name: Buat proyek Android
        run: |
          npx cap add android
          python3 patch_android.py
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle || true

      - name: Bangun APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Tanda tangani dengan kunci tetap
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::Kunci tetap belum diisi, APK memakai kunci sementara"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jc.p12"
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $SIGNER sign --ks "$RUNNER_TEMP/jc.p12" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias jecom android/app/build/outputs/apk/debug/app-debug.apk
          $SIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | head -3

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jejakcommuter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jejakcommuter-apk
          path: android-app/jejakcommuter.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK jejakcommuter #${{ github.run_number }}
          files: android-app/jejakcommuter.apk
