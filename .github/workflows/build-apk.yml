name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        run: npm install

      - name: Buat proyek Android
        run: |
          npx cap add android
          python3 patch_android.py
          npx cap sync android

      - name: Bangun APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jejakcommuter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jejakcommuter-apk
          path: android-app/jejakcommuter.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK jejakcommuter #${{ github.run_number }}
          files: android-app/jejakcommuter.apk
