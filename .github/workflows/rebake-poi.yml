name: Perbarui data tempat terdekat

on:
  schedule:
    - cron: "17 20 1 * *"   # tiap tanggal 1 pukul 03.17 WIB
  workflow_dispatch: {}      # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unduh peta Jawa dari Geofabrik (data OpenStreetMap)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL --retry 3 -o java.osm.pbf https://download.geofabrik.de/asia/indonesia/java-latest.osm.pbf
          osmium tags-filter java.osm.pbf nwr/amenity=fuel,place_of_worship,hospital,clinic,doctors,pharmacy nwr/shop=convenience,supermarket nwr/healthcare=hospital,clinic,doctor,centre,pharmacy -o poi.osm.pbf
          osmium export poi.osm.pbf -f geojsonseq -o poi.geojsonseq
          rm -f java.osm.pbf
      - name: Tulis poi.js
        run: python3 scripts/bake_poi.py --geojson poi.geojsonseq
      - name: Simpan bila ada perubahan
        run: |
          git config user.name "jejakcommuter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add poi.js
          rm -f poi.osm.pbf poi.geojsonseq
          git diff --cached --quiet && echo "Tidak ada perubahan" || (git commit -m "Perbarui data tempat terdekat" && git push)
